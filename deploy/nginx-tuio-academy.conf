# /etc/nginx/sites-available/tuio-academy  (opción A: nginx + Let's Encrypt)
# Sustituye formacion.tuiolabs.com por el dominio definitivo.
server {
    listen 80;
    listen [::]:80;
    server_name formacion.tuiolabs.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name formacion.tuiolabs.com;

    ssl_certificate     /etc/letsencrypt/live/formacion.tuiolabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/formacion.tuiolabs.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 5m;   # importación de CSV

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
